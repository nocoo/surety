name = "surety-db-proxy"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB_PROD"
database_name = "surety-db"
database_id = "placeholder-prod-id"

[[d1_databases]]
binding = "DB_API_E2E"
database_name = "surety-db-api-e2e"
database_id = "placeholder-api-e2e-id"

[[d1_databases]]
binding = "DB_UI_E2E"
database_name = "surety-db-ui-e2e"
database_id = "placeholder-ui-e2e-id"

[[d1_databases]]
binding = "DB_MCP_E2E"
database_name = "surety-db-mcp-e2e"
database_id = "placeholder-mcp-e2e-id"
