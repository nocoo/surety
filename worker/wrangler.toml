name = "surety"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB_PROD"
database_name = "surety-db"
database_id = "<your-prod-d1-database-id>"

[[d1_databases]]
binding = "DB_TEST"
database_name = "surety-db-test"
database_id = "<your-test-d1-database-id>"

[[r2_buckets]]
binding = "R2_PROD"
bucket_name = "surety"

[[r2_buckets]]
binding = "R2_TEST"
bucket_name = "surety-test"
