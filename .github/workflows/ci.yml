# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1–S3, G1, G2, B1, L1, L2, L3, Z1 via quality.yml;
# na L1.5, todo P1 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, L3 folded into quality.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l1-hook-probes:
    name: "L1: pre-commit gate probes"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JS and dependencies
        uses: nocoo/base-ci/.github/actions/setup-js@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
        with:
          package-manager: bun
          runtime-version: "1.4.2"
          install-policy: "trusted"

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          tar xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Husky hooks
        run: bun run prepare

      - name: L1 hook rejection self-test
        run: bun run test:l1:gate

  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.4.2"
      node-version: "26.12.1"
      install-policy: blocked
      coverage-path: coverage
      typecheck-command: bun run typecheck
      test-command: bun run test:coverage
      osv-config: osv-scanner.toml
      gitleaks-config: .gitleaks.toml
      build: true
      build-command: bun run build
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      workflow-lint-yamllint: true
      l2: true
      l2-command: bun run test:l2:http
      l3: true
      l3-browsers: chromium
      l3-browser-directory: apps/web
      l3-command: bun run test:e2e:browser
      env-json: '{"WRANGLER_SEND_METRICS": "false", "CI": "true"}'
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "未接入 @cloudflare/vitest-pool-workers；Worker 集成由 L2 wrangler HTTP 套件覆盖"},
        "L2": {"status": "impl"},
        "L3": {"status": "impl"},
        "P1": {"status": "todo", "reason": "@nocoo/surety CLI 有 npm 发布流程，尚未配置 ci:package / publint 检查"},
        "Z1": {"status": "impl"}}
