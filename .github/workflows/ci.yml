name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.4.2"
      install-policy: "trusted"
      coverage-path: "coverage"
      prepare-command: "bun run build"
      test-command: "bun run test:coverage"
      typecheck-command: "bun run typecheck"
      l2: true
      l2-command: "bun run test:l2:http"

  browser-e2e:
    name: "L3 Browser E2E"
    needs: [quality]
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      runtime-version: "1.4.2"
      install-policy: "blocked"
      browser: "chromium"
      browser-working-directory: "apps/web"
      timeout-minutes: 25
      command: "bun run test:e2e:browser"
