name: Quality Slots

on:
  workflow_call:
    outputs:
      tested-sha:
        description: Commit SHA verified by quality gate
        value: ${{ jobs.z1-gate.outputs.tested-sha }}

env:
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "26.12.1"
  WRANGLER_SEND_METRICS: "false"
  CI: "true"

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: blocked
      - run: bun run typecheck

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: blocked
      - run: bun run lint

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/lint-workflows@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: nocoo/base-ci/.github/actions/scan-secrets@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/scan-dependencies@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          lockfiles: "bun.lock"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: blocked
      - run: bun run build

  l1-unit:
    name: "L1: Unit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: blocked
      - run: bun run test:coverage

  l1-hook-probes:
    name: "L1: Unit (Pre-commit Gate)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: trusted
      - name: Install gitleaks (pinned v8.30.1)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          TAR_FILE="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --retry 5 --retry-delay 2 --retry-all-errors -sSfL \
            -o "$TAR_FILE" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${TAR_FILE}" | sha256sum --check
          tar -xzf "$TAR_FILE" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          rm -f "$TAR_FILE"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: bun run prepare && bun run test:l1:gate

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2_RUNTIME == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A - Cloudflare Worker project, covered by L3/L4"

  l3-integration:
    name: "L3: Integration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: blocked
      - run: bun run test:l2:http

  l4-e2e:
    name: "L4: E2E"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: bun
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: blocked
      - run: (cd apps/web && bunx playwright install --with-deps chromium) && bun run test:e2e:browser

  p1-package:
    name: "P1: Package"
    if: ${{ vars.ENABLE_P1_PACKAGE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO - @nocoo/surety npm package check"

  z1-gate:
    name: "Z1: Gate"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - s1-types
      - s2-lint
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - l1-unit
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
      - l1-hook-probes
    outputs:
      tested-sha: ${{ github.sha }}
    steps:
      - name: Verify all quality slots
        run: |
          echo "s1-types: ${{ needs.s1-types.result }}"
          echo "s2-lint: ${{ needs.s2-lint.result }}"
          echo "s3-workflow: ${{ needs.s3-workflow.result }}"
          echo "g1-secrets: ${{ needs.g1-secrets.result }}"
          echo "g2-dependencies: ${{ needs.g2-dependencies.result }}"
          echo "b1-build: ${{ needs.b1-build.result }}"
          echo "l1-unit: ${{ needs.l1-unit.result }}"
          echo "l2-runtime: ${{ needs.l2-runtime.result }}"
          echo "l3-integration: ${{ needs.l3-integration.result }}"
          echo "l4-e2e: ${{ needs.l4-e2e.result }}"
          echo "p1-package: ${{ needs.p1-package.result }}"
          echo "l1-hook-probes: ${{ needs.l1-hook-probes.result }}"
          for r in \
            "${{ needs.s1-types.result }}" \
            "${{ needs.s2-lint.result }}" \
            "${{ needs.s3-workflow.result }}" \
            "${{ needs.g1-secrets.result }}" \
            "${{ needs.g2-dependencies.result }}" \
            "${{ needs.b1-build.result }}" \
            "${{ needs.l1-unit.result }}" \
            "${{ needs.l3-integration.result }}" \
            "${{ needs.l4-e2e.result }}" \
            "${{ needs.l1-hook-probes.result }}"; do
            if [ "$r" != "success" ]; then
              echo "Required slot failed or was skipped: $r"
              exit 1
            fi
          done
          for r in \
            "${{ needs.l2-runtime.result }}" \
            "${{ needs.p1-package.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "Optional slot failed: $r"
              exit 1
            fi
          done
